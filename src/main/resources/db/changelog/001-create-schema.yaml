databaseChangeLog:
  # Full schema of the Center -> Course -> Group hierarchy plus the Student and Person
  # aggregates. Rewritten from scratch (see design.md, decision 5) because the H2
  # in-memory datasource is recreated on every boot, so there is no persisted data
  # to migrate.

  - changeSet:
      id: 001-create-center
      author: opencode-tutorial
      # Root of the hierarchy. CENTER is not a reserved keyword, so the table keeps
      # the natural name.
      changes:
        - createTable:
            tableName: center
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(150)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-course
      author: opencode-tutorial
      # A course belongs to exactly one center. The name is unique *within* the
      # center: two different centers may declare the same course name.
      changes:
        - createTable:
            tableName: course
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: center_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: course
            columnNames: center_id, name
            constraintName: uk_course_center_name
        - addForeignKeyConstraint:
            baseTableName: course
            baseColumnNames: center_id
            referencedTableName: center
            referencedColumnNames: id
            constraintName: fk_course_center
            onDelete: RESTRICT

  - changeSet:
      id: 003-create-person
      author: opencode-tutorial
      changes:
        - createTable:
            tableName: person
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: surname
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false

  - changeSet:
      id: 004-create-student-group
      author: opencode-tutorial
      # The table is named student_group (not group) because GROUP is a reserved
      # SQL keyword. See AGENTS.md. Every group belongs to exactly one course;
      # the group name is only unique within its course, so it is not globally unique.
      changes:
        - createTable:
            tableName: student_group
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: course_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: student_group
            columnNames: course_id, name
            constraintName: uk_group_course_name
        - addForeignKeyConstraint:
            baseTableName: student_group
            baseColumnNames: course_id
            referencedTableName: course
            referencedColumnNames: id
            constraintName: fk_group_course
            onDelete: RESTRICT

  - changeSet:
      id: 005-create-student
      author: opencode-tutorial
      # A student belongs to exactly one center and is associated with exactly one
      # person. Deleting a person is blocked by fk_student_person (ON DELETE RESTRICT).
      changes:
        - createTable:
            tableName: student
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: person_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: center_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: student
            baseColumnNames: person_id
            referencedTableName: person
            referencedColumnNames: id
            constraintName: fk_student_person
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: student
            baseColumnNames: center_id
            referencedTableName: center
            referencedColumnNames: id
            constraintName: fk_student_center
            onDelete: RESTRICT

  - changeSet:
      id: 006-create-student-group-link
      author: opencode-tutorial
      # Junction table for the Student <-> Group many-to-many, owned by Student.
      #
      # course_id is DENORMALIZED from student_group: the database cannot index an
      # expression that reads another table, and the invariant "a student is enrolled
      # in at most one group per course" has to be enforced here as well as in the
      # domain (see design.md, decision 1). StudentPersistenceAdapter fills it in.
      changes:
        - createTable:
            tableName: student_group_link
            columns:
              - column:
                  name: student_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: group_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: course_id
                  type: bigint
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: student_group_link
            columnNames: student_id, group_id
            constraintName: pk_student_group_link
        - addUniqueConstraint:
            tableName: student_group_link
            columnNames: student_id, course_id
            constraintName: uk_student_course
        - addForeignKeyConstraint:
            baseTableName: student_group_link
            baseColumnNames: student_id
            referencedTableName: student
            referencedColumnNames: id
            constraintName: fk_link_student
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: student_group_link
            baseColumnNames: group_id
            referencedTableName: student_group
            referencedColumnNames: id
            constraintName: fk_link_group
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: student_group_link
            baseColumnNames: course_id
            referencedTableName: course
            referencedColumnNames: id
            constraintName: fk_link_course
            onDelete: RESTRICT